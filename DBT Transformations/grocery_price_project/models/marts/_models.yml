version: 2

# Agent-facing marts for the grocery value agent. Definitions come from
# Agent/ONTOLOGY.md; descriptions here are persisted as Snowflake comments
# (persist_docs in dbt_project.yml) and read by the semantic view / Cortex
# Analyst — write them for that reader.

models:
  - name: dim_store
    description: >
      Where a price applies. One row per Kroger store (81 Atlanta-area
      stores, with address and coordinates) plus one virtual store,
      'walmart_national', because Walmart catalog prices are national.
    columns:
      - name: STORE_ID
        description: "Kroger locationId, or 'walmart_national' for Walmart."
        data_tests: [not_null, unique]
      - name: RETAILER
        description: "'kroger' or 'walmart'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['kroger', 'walmart']
      - name: STORE_NAME
        description: "Store display name, e.g. 'Kroger - Georgetown'."
      - name: CITY
        description: "Store city (Kroger only)."
      - name: ZIP_CODE
        description: "Store 5-digit ZIP code (Kroger only); join to zip_centroids_ga for distance."
      - name: LATITUDE
        description: "Store latitude (Kroger only)."
      - name: LONGITUDE
        description: "Store longitude (Kroger only)."
      - name: IS_VIRTUAL_STORE
        description: "TRUE for the Walmart national row."
      - name: DATA_AS_OF
        description: "When this store's details were last collected."

  - name: dim_product
    description: >
      One row per retailer product listing. The same physical item at both
      retailers is two rows linked by UPC_A / MATCHED_PRODUCT_ID. Filter
      IS_GROCERY = TRUE for shopping questions (excludes Walmart's Flower
      Shop / Food Gifts and Kroger non-food departments).
    columns:
      - name: PRODUCT_KEY
        description: "RETAILER:PRODUCT_ID — unique key across both retailers."
        data_tests: [not_null, unique]
      - name: RETAILER
        description: "'kroger' or 'walmart'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['kroger', 'walmart']
      - name: PRODUCT_ID
        description: "Kroger productId or Walmart itemId (text — Kroger IDs have meaningful leading zeros)."
        data_tests: [not_null]
      - name: PRODUCT_NAME
        description: "Product name/description as the retailer lists it."
      - name: BRAND
        description: "Brand name."
      - name: SIZE_TEXT
        description: "Package size as Kroger lists it (e.g. '16 oz', '12 ct / 4 oz'). Null for Walmart, whose size is embedded in PRODUCT_NAME."
      - name: UPC_A
        description: "12-digit UPC-A, set only for products proven identical at both retailers."
      - name: MATCHED_PRODUCT_ID
        description: "The other retailer's PRODUCT_ID for the same UPC, when matched."
      - name: PRIMARY_COMMON_CATEGORY
        description: "Retailer-neutral category (e.g. Dairy, Snacks) from the category crosswalk; the first alphabetically when a Kroger product sits in several."
      - name: COMMON_CATEGORIES
        description: "All common categories the product maps to (array)."
      - name: TEMPERATURE
        description: "Kroger storage temperature: Ambient, Refrigerated, Frozen, Hot."
      - name: IS_SHELF_STABLE
        description: "TRUE if storable at room temperature (Kroger: TEMPERATURE = Ambient; Walmart: shelf-stable common category). Basis for stock-up advice."
      - name: CUSTOMER_RATING
        description: "Walmart average customer rating (0–5)."
      - name: NUM_REVIEWS
        description: "Walmart review count."
      - name: IS_GROCERY
        description: "TRUE if the product maps to a common grocery category. Use for every shopping answer."
      - name: HAS_EXACT_MATCH
        description: "TRUE if the identical UPC is carried by the other retailer."
      - name: DATA_AS_OF
        description: "When this product's catalog details were last collected."

  - name: fct_price_weekly
    description: >
      One row per product x store x collection week actually observed.
      Weeks with no collection (e.g. the 2026-10-17 to 2026-11-14 outage)
      are absent — treat them as unknown, never as 'price unchanged'.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [PRODUCT_KEY, STORE_ID, PRICE_WEEK]
    columns:
      - name: PRODUCT_KEY
        description: "RETAILER:PRODUCT_ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: PRODUCT_KEY
              config:
                severity: warn
      - name: STORE_ID
        description: "Kroger store or 'walmart_national'."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: STORE_ID
              config:
                severity: warn
      - name: PRICE_WEEK
        description: "Monday of the collection week."
        data_tests: [not_null]
      - name: OBSERVED_AT
        description: "Exact collection timestamp of the price used for this week."
      - name: REGULAR_PRICE
        description: "Non-sale price: Kroger regular price; Walmart MSRP (often null)."
      - name: PROMO_PRICE
        description: "Sale price, only when below the regular price; null otherwise."
      - name: EFFECTIVE_PRICE
        description: "What a shopper pays that week: promo price if any, else regular (Walmart: sale price, else MSRP). Use for every 'cheapest' answer."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
              config:
                severity: warn
      - name: IS_ON_PROMO
        description: "TRUE when a promo price below regular applied."
      - name: DISCOUNT_PCT
        description: "1 - promo/regular when on promo (0.25 = 25% off)."

  - name: fct_product_price_summary
    description: >
      One row per product x store: latest price vs the item's own history
      at that store. Use for price drops (CHANGE_*), deal checks
      (DEAL_QUALITY, IS_AT_HISTORIC_LOW), and promo frequency. Present only
      IS_CURRENTLY_LISTED rows as current prices. REF_WEEK_* is the week a
      change was actually measured against (can be older than N weeks
      across collection gaps) — cite it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [PRODUCT_KEY, STORE_ID]
    columns:
      - name: PRODUCT_KEY
        description: "RETAILER:PRODUCT_ID."
        data_tests: [not_null]
      - name: STORE_ID
        description: "Kroger store or 'walmart_national'."
        data_tests: [not_null]
      - name: CURRENT_WEEK
        description: "Latest week this product was observed at this store."
      - name: DATA_AS_OF
        description: "Collection timestamp of the current price."
      - name: IS_CURRENTLY_LISTED
        description: "TRUE if observed in the retailer's latest collection week. Only these are current prices."
      - name: CURRENT_PRICE
        description: "Current effective price."
        data_tests: [not_null]
      - name: IS_ON_PROMO
        description: "Currently on promo."
      - name: WEEKS_OBSERVED
        description: "Collection weeks this product was seen at this store (all history)."
      - name: TRAILING_LOW_PRICE
        description: "Lowest effective price in the trailing window (var history_trailing_weeks, default 12)."
      - name: TRAILING_MEDIAN_PRICE
        description: "Median effective price in the trailing window."
      - name: TRAILING_HIGH_PRICE
        description: "Highest effective price in the trailing window."
      - name: PRICE_PERCENTILE
        description: "Share of other trailing-window weeks that were cheaper than now: 0 = cheapest seen, 1 = most expensive."
      - name: ALL_TIME_LOW_PRICE
        description: "Lowest effective price ever observed here (history starts Aug 2026 for Kroger, Sep 2026 for Walmart)."
      - name: IS_AT_HISTORIC_LOW
        description: "Current price equals or beats the all-time low (requires 2+ observations)."
      - name: CHANGE_4W
        description: "Current price minus the price ~4 weeks earlier ($; negative = price dropped)."
      - name: CHANGE_4W_PCT
        description: "CHANGE_4W as a fraction of the earlier price (-0.2 = 20% cheaper)."
      - name: REF_WEEK_4W
        description: "Week the 4-week change was measured against."
      - name: CHANGE_8W_PCT
        description: "8-week percent change (REF_WEEK_8W = comparison week)."
      - name: CHANGE_12W_PCT
        description: "12-week percent change (REF_WEEK_12W = comparison week)."
      - name: PROMO_WEEK_SHARE
        description: "Share of observed weeks on promo."
      - name: PROMO_EPISODES
        description: "Number of separate promo runs observed."
      - name: AVG_PROMO_DISCOUNT_PCT
        description: "Average discount during promo weeks."
      - name: WEEKS_PER_PROMO
        description: "Observed weeks per promo run — roughly how often it goes on sale."
      - name: DEAL_QUALITY
        description: "GENUINE (promo well below its usual regular price and not routine), ORDINARY (routine or shallow promo), INFLATED_REFERENCE (Walmart MSRP far above any price it has sold at), NOT_ON_PROMO."
        data_tests:
          - accepted_values:
              arguments:
                values: ['GENUINE', 'ORDINARY', 'INFLATED_REFERENCE', 'NOT_ON_PROMO']

  - name: fct_product_price_rollup
    description: >
      One row per product across the stores that currently list it. Use for
      product-level answers (biggest drops, what's on sale, lowest price for
      X) so an item priced the same at every Kroger appears once, with a
      store count. Changes are the MEDIAN store change; LARGEST_DROP_4W_PCT
      is the best single store. Per-store detail: fct_product_price_summary.
    columns:
      - name: PRODUCT_KEY
        description: "RETAILER:PRODUCT_ID."
        data_tests: [not_null, unique]
      - name: STORES_LISTED
        description: "Stores with a current price (Walmart: 1)."
      - name: MIN_CURRENT_PRICE
        description: "Lowest current price across stores."
        data_tests: [not_null]
      - name: MEDIAN_CURRENT_PRICE
        description: "Typical current price across stores."
      - name: CHEAPEST_STORE_ID
        description: "Store with the lowest current price (join dim_store for name)."
      - name: PRICE_VARIES_BY_STORE
        description: "TRUE if current prices differ between stores."
      - name: STORES_ON_PROMO
        description: "Stores where it's currently on promo."
      - name: STORES_WITH_GENUINE_DEAL
        description: "Stores where the current promo is a GENUINE deal."
      - name: STORES_AT_HISTORIC_LOW
        description: "Stores where the current price is the lowest ever observed there."
      - name: MEDIAN_PRICE_PERCENTILE
        description: "Median across stores of PRICE_PERCENTILE (0 = cheapest seen recently)."
      - name: MEDIAN_CHANGE_4W_PCT
        description: "Median store's 4-week price change (-0.2 = 20% cheaper). Cite REF_WEEK_4W."
      - name: LARGEST_DROP_4W_PCT
        description: "Biggest single-store 4-week drop."
      - name: STORES_PRICE_DROPPED_4W
        description: "Stores where the price fell over ~4 weeks."
      - name: REF_WEEK_4W
        description: "Most common comparison week for the 4-week change."
      - name: DATA_AS_OF
        description: "Latest collection timestamp behind these prices."

  - name: fct_cross_retailer_price_comparison
    description: >
      One row per product carried by both retailers (identical UPC): Walmart
      price vs Kroger's lowest current store price (named) and median across
      stores. The only like-for-like cross-retailer comparison.
    columns:
      - name: UPC_A
        description: "Shared 12-digit UPC-A."
        data_tests: [not_null, unique]
      - name: PRODUCT_NAME
        description: "Product name including package size (Walmart's name, which carries the size; else Kroger's description plus its size). Always show it with the size — similar names can be different sizes."
      - name: PACKAGE_SIZE
        description: "Kroger's package size for this UPC, e.g. '12 fl oz'."
      - name: KROGER_PRODUCT_NAME
        description: "Kroger's own description of the product."
      - name: WALMART_PRODUCT_NAME
        description: "Walmart's own product name."
      - name: WALMART_PRICE
        description: "Walmart current effective price."
      - name: KROGER_MIN_PRICE
        description: "Lowest current Kroger price across stores."
      - name: KROGER_MEDIAN_PRICE
        description: "Median current Kroger price across stores."
      - name: KROGER_CHEAPEST_STORE_NAME
        description: "Store with KROGER_MIN_PRICE."
      - name: KROGER_STORES_PRICED
        description: "Kroger stores with a current price for this product."
      - name: IS_PRICED_AT_BOTH
        description: "TRUE when both sides have a current price; filter on it for comparisons."
      - name: CHEAPER_RETAILER
        description: "'walmart', 'kroger' or 'tie' — Walmart vs Kroger's cheapest store."
        data_tests:
          - accepted_values:
              arguments:
                values: ['walmart', 'kroger', 'tie']
      - name: SAVINGS_VS_KROGER_MIN
        description: "Dollar gap between Walmart and Kroger's cheapest store."
      - name: CHEAPER_RETAILER_VS_MEDIAN
        description: "Cheaper retailer vs a typical (median) Kroger store."

  - name: fct_product_availability_current
    description: >
      Stock and fulfillment per product x store as of the last weekly
      collection — not live. Walmart 'not_available_online' is an online
      flag on ~98% of priced items; never call it out of stock.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [PRODUCT_KEY, STORE_ID]
    columns:
      - name: PRODUCT_KEY
        description: "RETAILER:PRODUCT_ID."
        data_tests: [not_null]
      - name: AVAILABILITY_STATUS
        description: "in_stock, low_stock, out_of_stock, not_available_online (Walmart only), unknown."
        data_tests:
          - accepted_values:
              arguments:
                values: ['in_stock', 'low_stock', 'out_of_stock', 'not_available_online', 'unknown']
      - name: IS_CURBSIDE_AVAILABLE
        description: "Kroger curbside pickup offered."
      - name: IS_DELIVERY_AVAILABLE
        description: "Kroger delivery offered."
      - name: IS_CLEARANCE
        description: "Walmart clearance flag."
      - name: DATA_AS_OF
        description: "Collection timestamp — say 'as of' this in answers."
