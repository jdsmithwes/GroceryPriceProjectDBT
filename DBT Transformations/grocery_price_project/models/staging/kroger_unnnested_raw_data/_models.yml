version: 2

groups:
  - name: kroger
    owner:
      name: Jamaal Smith
      email: jdsmithwes@protonmail.com
  - name: walmart
    owner:
      name: Jamaal Smith
      email: jdsmithwes@protonmail.com

models:
  # ============================================================
  # Layer 1 — thin rename over the RAW source, same grain as RAW.
  # (stg_kroger_locations/pricing/inventory are materialized as
  # ephemeral — no physical Snowflake object, inlined into whatever
  # refs them.)
  # ============================================================

  - name: stg_kroger_product_catalog
    config:
      materialized: view
      group: kroger
    description: "The entire Kroger product catalog."
    columns:
      - name: PRODUCT_ID
        description: ""
        data_tests:
          - not_null
          - unique
      - name: UPC
        description: ""
      - name: BRAND
        description: ""
      - name: DESCRIPTION
        description: ""
      - name: CATEGORIES
        description: ""
      - name: COUNTRY_ORIGIN
        description: ""
      - name: TEMPERATURE
        description: ""
      - name: SIZE
        description: ""
      - name: SOLD_BY
        description: ""
      - name: IMAGE_URL
        description: ""
      - name: COLLECTED_AT
        description: ""
      - name: INGESTED_FILENAME
        description: ""

  - name: stg_kroger_locations
    config:
      materialized: ephemeral
      group: kroger
    description: ""
    columns:
      - name: LOCATION_ID
        description: ""
        data_tests:
          - not_null
      - name: REGION
        description: ""
      - name: RAW_DATA
        description: ""
      - name: COLLECTED_AT
        description: ""
      - name: INGESTED_FILENAME
        description: ""

  - name: stg_kroger_product_snapshot
    config:
      materialized: ephemeral
      group: kroger
    description: >
      Union of RAW.KROGER_PRICING and RAW.KROGER_INVENTORY. Both pipelines
      call the identical Kroger endpoint and land the identical raw
      response (see the NOTE in Kroger_Pricing_*.py) — merged into one
      model instead of two parallel ones; SOURCE_PIPELINE preserves which
      pipeline collected each row.
    columns:
      - name: PRODUCT_ID
        description: ""
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kroger_product_catalog')
              field: PRODUCT_ID
      - name: LOCATION_ID
        description: ""
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kroger_locations')
              field: LOCATION_ID
      - name: RAW_DATA
        description: ""
      - name: COLLECTED_AT
        description: ""
      - name: INGESTED_FILENAME
        description: ""
      - name: SOURCE_PIPELINE
        description: "'pricing' or 'inventory' — which collection script produced this row."
        data_tests:
          - accepted_values:
              values: ['pricing', 'inventory']

  # ============================================================
  # Layer 2 — PARSE_JSON(RAW_DATA), top-level keys + fixed-shape
  # nested objects flattened into columns. Same grain as Layer 1.
  # Remaining array-typed columns (VARIANT) are fanned out into
  # their own models one level up in models/staging/ — see
  # Project Architecture.md for the full lineage/reasoning.
  # ============================================================

  - name: stg_json_kroger_locations
    config:
      materialized: view
      group: kroger
    description: ""
    columns:
      - name: REGION
        description: ""
      - name: COLLECTED_AT
        description: ""
      - name: INGESTED_FILENAME
        description: ""
      - name: LOCATION_ID
        description: ""
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_kroger_locations')
              field: LOCATION_ID
      - name: STORE_NUMBER
        description: ""
      - name: DIVISION_NUMBER
        description: ""
      - name: CHAIN
        description: ""
      - name: NAME
        description: ""
      - name: PHONE
        description: ""
      - name: ADDRESS_LINE1
        description: ""
      - name: CITY
        description: ""
      - name: STATE
        description: ""
      - name: ZIP_CODE
        description: ""
      - name: COUNTY
        description: ""
      - name: LATITUDE
        description: ""
      - name: LONGITUDE
        description: ""
      - name: LAT_LNG
        description: ""
      - name: HOURS_TIMEZONE
        description: ""
      - name: HOURS_GMT_OFFSET
        description: ""
      - name: HOURS_OPEN24
        description: ""
      - name: MONDAY_OPEN
        description: ""
      - name: MONDAY_CLOSE
        description: ""
      - name: MONDAY_OPEN24
        description: ""
      - name: TUESDAY_OPEN
        description: ""
      - name: TUESDAY_CLOSE
        description: ""
      - name: TUESDAY_OPEN24
        description: ""
      - name: WEDNESDAY_OPEN
        description: ""
      - name: WEDNESDAY_CLOSE
        description: ""
