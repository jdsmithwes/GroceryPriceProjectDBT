name: grocery_price_project

profile: grocery_price_project

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Grocery value agent thresholds — one place to tune them (definitions in
  # Agent/ONTOLOGY.md).
  shelf_stable_common_categories:
    - Baking Goods
    - Beverages
    - Breakfast
    - Candy
    - Canned & Packaged
    - Condiment & Sauces
    - International
    - Pasta, Sauces, Grain
    - Snacks
  # Common categories that are food or drink. IS_FOOD on dim_product uses it;
  # 'Baby' is left out because it mixes baby food with diapers and wipes.
  food_common_categories:
    - Adult Beverage
    - Bakery
    - Baking Goods
    - Beverages
    - Breakfast
    - Candy
    - Canned & Packaged
    - Condiment & Sauces
    - Dairy
    - Deli
    - Frozen
    - International
    - Meat & Seafood
    - Pasta, Sauces, Grain
    - Produce
    - Snacks
  history_trailing_weeks: 12        # window for low/median/high and percentile
  deal_genuine_discount_pct: 0.10   # promo at least this far below the item's median regular price
  deal_routine_promo_share: 0.50    # on promo in at least this share of observed weeks = routine
  deal_inflated_reference_ratio: 1.5  # Walmart MSRP this many times the highest sale price ever seen
  buy_min_weeks_for_signal: 6       # fewer observed weeks = INSUFFICIENT_HISTORY
  buy_good_percentile: 0.25         # at/below the item's own 25th percentile = GOOD_PRICE
  buy_high_percentile: 0.75         # at/above its own 75th percentile = HIGH_PRICE
  forecast_move_pct: 0.05           # forecast low must be 5%+ below today to count as "expected lower"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  grocery_price_project:
    +schema: raw

models:
  grocery_price_project:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # Pushes _models.yml descriptions into Snowflake comments, which the
      # semantic view and Cortex Analyst read as business context.
      +persist_docs:
        relation: true
        columns: true
    semantic:
      # Semantic views for Cortex Analyst (dbt_semantic_view package) ->
      # GROCERY_SEMANTIC in prod, GROCERY_DEV_SEMANTIC in sandbox.
      +schema: semantic